on:
  push:
    branches:
      - main

name: Release FoundryVTT Module

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check_version:
    name: Check FoundryVTT module version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Check for new version
        id: check_for_new_version
        uses: salsify/action-detect-and-tag-new-version@v2
        with:
          create-tag: false
          version-command: |
            jq -r .version module.json
    outputs:
      module_previous_version: v${{ steps.check_for_new_version.outputs.previous-version }}
      module_current_version: v${{ steps.check_for_new_version.outputs.current-version }}
  build:
    name: Release FoundryVTT Module
    runs-on: ubuntu-latest
    needs: check_version
    if: ${{ needs.check_version.outputs.module_current_version != needs.check_version.outputs.module_previous_version }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v5
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"
      - name: Create tag changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --reverse --pretty=oneline --abbrev-commit ${{ needs.check_version.outputs.module_previous_version }}..HEAD^)
          echo "Got changelog: $CHANGELOG"
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Update download URL
        id: update_module_download_url
        env:
          DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ needs.check_version.outputs.module_current_version }}/${{ github.event.repository.name }}.zip
        run: |
          jq --arg url "$DOWNLOAD_URL" '.download = $url' module.json > module.json.tmp
          mv module.json.tmp module.json
      - name: Install dependencies
        id: install_dependencies
        run: pnpm install --frozen-lockfile
      - name: Build package
        id: build
        run: pnpm run build
      - name: Package module
        working-directory: ./dist
        run: zip -r ../${{ github.event.repository.name }}.zip .
      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.check_version.outputs.module_current_version }}
          name: Release ${{ needs.check_version.outputs.module_current_version }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: true
          files: |
            ./${{ github.event.repository.name }}.zip
            ./module.json
